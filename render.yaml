# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: forkcast
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Secrets: Render asks for these when you create the Blueprint. They are never stored in git.
      - key: GEMINI_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
