<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Forkcast · Menu Matcher{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="page">
    <main class="main">
      <div class="column">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="site-footer">Forkcast suggestions are a guide. Always confirm allergens with the restaurant.</footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
