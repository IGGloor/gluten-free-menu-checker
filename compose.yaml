# Local PostgreSQL for development and tests:  docker compose up -d
# It creates two databases: "forkcast" (for running the app) and "forkcast_test" (for pytest).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forkcast
      POSTGRES_PASSWORD: forkcast
      POSTGRES_DB: forkcast
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forkcast -d forkcast"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
